# Java logging for the Firestore emulator in e2e runs (playwright.config.ts).
# A burst of thousands of writes (the "stress" fixture set) passes the
# emulator's fixed limit of 10,000 messages waiting on one live-update
# connection; it then drops that connection but warns again on every later
# write, millions of lines. The app reconnects and the tests pass, so those
# three loggers only report errors.
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = ALL
com.google.net.webchannel.server.level = SEVERE
com.google.cloud.datastore.emulator.firestore.webchannel.level = SEVERE
