<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veil prototype: screens and states</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Jost:wght@300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/veil.css">
<style>
  .toc { list-style: none; margin-top: 36px; border-top: 1px solid var(--line); }
  .toc > li { padding: 20px 4px; border-bottom: 1px solid var(--line); }
  .toc h2 { font-family: var(--serif); font-size: 26px; font-weight: 500; }
  .toc h2 a { text-decoration: none; }
  .toc p { font-size: 14px; color: var(--ink-2); margin-top: 2px; }
  .toc .st { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 14px; }
  .toc .st a { text-decoration: underline; text-decoration-color: var(--champagne); text-underline-offset: 3px; }
</style>
</head>
<body>
<header class="top"><span class="couple">Veil <span>&amp;</span> prototype</span><span class="where">Stage 2</span><span></span></header>
<main>
  <section class="hero"><h1>Screens and states</h1><p class="sub">Open any screen on a phone or computer. The dashed “Prototype” tab in the corner switches states and the stress data.</p></section>
  <ul class="toc" id="toc"></ul>
</main>
<script>
const S = [
  ["budget.html", "Budget", "B5, B6, B7, B8, O2, S6: still to pay, the next payment and the doors into the detail", [["", "Normal"], ["state=empty", "Nothing booked yet"], ["state=loading", "Loading"], ["state=error", "Couldn't load"], ["state=offline", "Offline"], ["state=demo", "Demonstration mode"], ["state=sync", "Bella's change arrives"], ["stress", "Stress data"]]],
  ["bookings.html", "Bookings", "B1, B3, B5, B9, B12: every booking with its parts, ordered by any field", [["", "Normal"], ["state=empty", "Nothing booked yet"], ["state=noresults", "No results"], ["state=loading", "Loading"], ["state=error", "Couldn't load"], ["state=offline", "Offline"], ["state=demo", "Demonstration mode"], ["state=sync", "Bella's change arrives"], ["stress", "Stress data (1,206 bookings)"]]],
  ["booking.html?id=samaya", "A booking in parts", "B3, B4, B12, B1: Villa Samaya, three instalments", [["", "Normal"], ["state=savefail", "A change didn't save"], ["state=uploading", "Uploading files"], ["state=gone", "Removed by Bella"], ["state=loading", "Loading"], ["state=error", "Couldn't load"], ["state=offline", "Offline"], ["state=demo", "Demonstration mode"]]],
  ["booking.html?id=ayu", "A single booking", "B3, B4: one price, ready to split into parts", [["", "Normal"], ["state=savefail", "A change didn't save"]]],
  ["booking.html?id=kirana", "An overpaid booking", "B5: paid more than the price", [["", "Normal"]]],
  ["booking.html?id=rana", "A late booking", "B6: one part is late, one add-on", [["", "Normal"]]],
  ["booking.html?id=s-deep", "A booking with 40 parts", "Stress: deep nesting, long unbroken name, tiny and huge images", [["stress", "Stress data"], ["stress&state=uploading", "Stress data, uploading"]]],
  ["booking-new.html", "Add a booking", "B2: something booked outside Vendors and Venues", [["", "Normal"], ["state=busy", "Adding"], ["state=failed", "Couldn't add"], ["state=demo", "Demonstration mode"], ["state=offline", "Offline"]]],
  ["payments.html", "Payments due", "B6, S6, O2: every unpaid amount with a date, late first", [["", "Normal"], ["state=empty", "Nothing due"], ["state=loading", "Loading"], ["state=error", "Couldn't load"], ["state=offline", "Offline"], ["state=demo", "Demonstration mode"], ["state=sync", "Bella's change arrives"], ["stress", "Stress data"]]],
  ["funders.html", "Who pays", "B7, B11: paid and still to pay per funder; add, rename, remove", [["", "Normal"], ["state=empty", "Nothing booked yet"], ["state=rename", "Renaming"], ["state=adding", "Adding"], ["state=loading", "Loading"], ["state=offline", "Offline"], ["state=sync", "Bella's change arrives"], ["stress", "Stress data (14 funders)"]]],
  ["vendors.html", "Vendors", "F6, F7, F9–F15, F23: capture, browse by category, keen, WhatsApp, export, own categories", [["", "Normal"], ["state=empty", "No vendors yet"], ["state=noresults", "No results"], ["state=capture", "Adding a vendor"], ["state=categories", "Editing categories"], ["state=taken", "Category name taken"], ["state=loading", "Loading"], ["state=offline", "Offline"], ["state=demo", "Demonstration mode"], ["state=sync", "Bella adds a vendor"], ["stress", "Stress data (2,004 vendors)"]]],
  ["vendor.html?id=kebun", "A vendor", "F7, F8, F9, F10, F11, F13, F16, B1: prices, stage, reputation, notes, files, copy to the shortlist", [["", "Normal"], ["state=savefail", "A change didn't save"], ["state=uploading", "Uploading files"], ["state=demo", "Demonstration mode"]]],
  ["vendor.html?id=ara", "A vendor with no prices", "F6, F8: just noted, nothing yet", [["", "Normal"]]],
  ["vendor.html?id=nusantara", "A ruled-out vendor", "F10: ruled out, drawn apart", [["", "Normal"]]],
  ["vendor.html?id=sv-long", "A vendor under stress", "30 price options, a long note with links, a long unbroken name", [["stress", "Stress data"]]],
  ["shortlist.html", "Shortlist", "F17, F18, F19, F21: finalists side by side, by category", [["", "Normal"], ["state=empty", "Nothing on the shortlist"], ["state=adding", "Adding a finalist"], ["state=loading", "Loading"], ["state=demo", "Demonstration mode"], ["stress", "Stress data (83 finalists)"]]],
  ["finalist.html?id=f-kebun", "A finalist", "F17, F18, F20, F24: packages, popularity, files from the vendor, book it", [["", "Normal"], ["state=booking", "Booking it"], ["state=uploading", "Uploading files"]]],
  ["finalist.html?id=f-arka", "A finalist added from scratch", "F21, F24: no vendor behind it, so it can move into Vendors", [["", "Normal"]]],
  ["finalist.html?id=sf-deep", "A finalist under stress", "30 packages, huge counts", [["stress", "Stress data"]]],
  ["venues.html", "Venues", "F1, F3, F4, F5, F22, B1: capture, narrow by cost and capacity, order, files", [["", "Normal"], ["state=empty", "No venues yet"], ["state=noresults", "No results"], ["state=loading", "Loading"], ["state=demo", "Demonstration mode"], ["stress", "Stress data (302 venues)"]]],
  ["documents.html", "Documents", "R6: newest first, extracts, search inside, quick start for meeting notes", [["", "Normal"], ["state=empty", "Nothing written yet"], ["state=noresults", "No results"], ["state=loading", "Loading"], ["state=offline", "Offline"], ["state=demo", "Demonstration mode"], ["state=sync", "Bella starts a document"], ["stress", "Stress data (1,504 documents)"]]],
  ["doc.html?new=meeting", "Meeting notes, just started", "R1, R2, R5: date, prices table with a growing total, next steps; cursor in the title", [["", "Normal"]]],
  ["doc.html?id=kebun-meeting", "A document", "R1–R5, R7: rich text, a table with a total, links, autosave, delete", [["", "Saved"], ["state=unsaved", "Not saved yet"], ["state=saving", "Saving"], ["state=savefail", "Couldn't save"], ["state=offline-edit", "Went offline while writing"], ["state=table", "Cursor in a table"], ["state=formula", "Editing a total"], ["state=sync-edit", "Bella is in it too"], ["state=demo", "Demonstration mode"]]],
  ["doc.html?id=scratch", "Totals with mistakes", "R4: a growing total, a bad reference and a total that includes itself", [["", "Normal"], ["state=formula-error", "Cursor on the mistake"]]],
  ["doc.html?id=s-long", "A document under stress", "40 long paragraphs, a 50 × 8 table with totals, four-deep lists, an unbroken title", [["stress", "Stress data"], ["stress&state=table", "Stress data, cursor in the big table"]]],
  ["files.html", "Files", "R8–R14: nested folders, upload, details, move, delete for good, find from anywhere", [["", "Normal"], ["state=empty", "No files yet"], ["state=emptyfolder", "An empty folder"], ["state=noresults", "No results"], ["state=uploading", "Uploading (progress, shrinking, too large, failed)"], ["state=file", "A file's details"], ["state=moving", "Moving a folder"], ["state=loading", "Loading"], ["state=demo", "Demonstration mode"], ["state=sync", "Bella uploads a file"], ["stress", "Stress data"]]],
  ["files.html?folder=old", "A folder three levels down", "R8: the path above always says where you are", [["", "Normal"], ["state=file", "A file's details"]]],
  ["files.html?folder=big", "3,000 files in one folder", "Stress: 40 subfolders and 3,000 photos", [["stress", "Stress data"]]],
  ["files.html?state=deep", "Thirty folders deep", "Stress: the path folds its middle away", [["stress", "Stress data"]]],
  ["whatif.html", "What-if items", "B8, B9, B10: ideas kept apart, the projected total and who would pay", [["", "Normal"], ["state=empty", "No what-if items"], ["state=loading", "Loading"], ["state=offline", "Offline"], ["state=demo", "Demonstration mode"], ["stress", "Stress data (301 items)"]]],
];
const url = (p, q) => q ? p + (p.includes("?") ? "&" : "?") + q : p;
document.getElementById("toc").innerHTML = S.map(([p, t, d, st]) => `<li><h2><a href="${p}">${t}</a></h2><p>${d}</p><div class="st">${st.map(([q, l]) => `<a href="${url(p, q)}">${l}</a>`).join("")}</div></li>`).join("");
</script>
</body>
</html>
