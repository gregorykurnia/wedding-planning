<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Jost:wght@300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/veil.css">
<style>
  .steps-how { margin-top: 10px; padding-left: 1.3em; font-size: 15px; }
  .steps-how li + li { margin-top: 6px; }
  .who { list-style: none; border-top: 1px solid var(--line); }
  .who li { display: flex; justify-content: space-between; gap: 16px; padding: 14px 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .who b { font-family: var(--serif); font-size: 21px; font-weight: 500; }
  .who span { color: var(--ink-2); font-size: 14.5px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main id="main"></main>
<script src="assets/data.js"></script>
<script src="assets/data-schedule.js"></script>
<script src="assets/app.js"></script>
<script>
const V = Veil, S = V.STATE, d = V.data;
if (S === "notif-default") d.notif = "default";
if (S === "notif-denied") d.notif = "denied";
const phone = innerWidth < 760;

function setSave(t, failed) { const el = V.$("#save"); if (el) { el.textContent = t; el.classList.toggle("failed", !!failed); } }

V.init({
  where: "Settings", section: "settings.html", noun: "your settings",
  states: [["savefail", "A change didn't save"], ["notif-default", "Notifications not yet allowed"], ["notif-denied", "Notifications turned off"], ["notif-install", "iPhone, not on the home screen yet"], ["notif-unsupported", "Browser can't show reminders"], ["installed", "Installed on this phone"], ["loading", "Loading"], ["offline", "Offline"], ["demo", "Demonstration mode"]],
  render(main) {
    const notif = V.notifNote("settings");
    /* N11: reminders set before for a time of day can't arrive; say how many and where to choose again */
    const badRem = (d.events || []).filter(V.remindBad);
    const remLine = badRem.length && !V.DEMO ? `<p class="note" style="color:var(--rose-ink)">${badRem.length === 1 ? "1 appointment or call has" : badRem.length + " appointments and calls have"} a reminder you set before for a time of day, which can't arrive. <a class="link rose" href="${V.href("schedule.html")}">Choose again in the schedule</a></p>` : "";
    main.innerHTML = `<section class="hero"><h1>Wedding settings</h1><p class="save-state ${S === "savefail" ? "failed" : ""}" id="save" role="status">${S === "savefail" ? "1 change not saved" : V.DEMO ? "Demonstration mode: changes aren't saved" : "Every change saves as you go"}</p></section>

      <h2 class="section-h">The two of you</h2>
      <div class="fields">
        <div class="field"><label for="n1">First name</label><input id="n1" data-i="0" dir="auto" value="${d.couple ? V.esc(d.couple[0]) : ""}"></div>
        <div class="field ${S === "savefail" ? "failed" : ""}"><label for="n2">Second name</label><input id="n2" data-i="1" dir="auto" value="${S === "savefail" ? "Isabella" : d.couple ? V.esc(d.couple[1]) : ""}">${S === "savefail" ? `<p class="err">Couldn't save. What you typed is kept. <button class="link rose" id="retry">Try again</button></p>` : `<p class="hint">Used wherever the planner addresses you${d.couple ? `, like ${V.esc(d.couple[0])} &amp; ${V.esc(d.couple[1])} at the top` : ""}.</p>`}</div>
        <div class="field"><label for="wd">Wedding date</label><input id="wd" type="date" value="${d.wedding || ""}"><p class="hint">Every countdown and date works from this.</p></div>
      </div>

      <h2 class="section-h">Who can open the planner</h2>
      ${V.DEMO ? `<p class="note">Demonstration mode: nobody is signed in. Once the planner is connected, only your two accounts can open it.</p>`
      : `<ul class="who"><li><b>${V.esc(d.me.name)}, you</b><span>${V.esc(d.me.email)}, signed in with Google</span></li><li><b>${V.esc(d.partner)}</b><span>${V.esc(d.partnerEmail || "")}</span></li></ul>
      <p class="note">Only these two accounts can see or change anything. Anyone else who signs in sees nothing.</p>
      <p class="note">Each name belongs to one account, so the planner can say which of you changed something. Changes you make on your other ${phone ? "computer" : "phone"} show as yours. Names the wrong way round? <button class="link" id="swap">Swap them</button></p>`}
      ${V.DEMO ? "" : `
      <p style="margin-top:14px"><a class="btn quiet small" href="signin.html?state=signedout">Sign out of this ${phone ? "phone" : "computer"}</a></p>`}

      <h2 class="section-h">Reminders on this ${phone ? "phone" : "computer"}</h2>${notif}${remLine}

      <h2 class="section-h" id="install">On your phone</h2>
      ${S === "installed" ? `<p class="note">Installed on this phone. Open it from your home screen like any app.</p>`
        : `<p class="note">Add the planner to your home screen and it opens like an app, full screen and one tap away.</p>
        <ol class="steps-how"><li><b>iPhone:</b> open the planner in Safari, tap Share, then Add to Home Screen.</li><li><b>Android:</b> open it in Chrome, tap the menu, then Install app.</li></ol>`}

      <h2 class="section-h">Also</h2>
      <ul class="doors" style="margin-top:6px">
        <li><a href="${V.href("funders.html")}"><span class="t">Who pays</span><span class="v">Add, rename or remove funders</span>${V.ICON.chev}</a></li>
        <li><a href="${V.href("vendors.html", { state: "categories" })}"><span class="t">Vendor categories</span><span class="v">Your own categories</span>${V.ICON.chev}</a></li>
      </ul>`;
    V.$$("[data-i]", main).forEach((el) => el.onchange = () => { if (V.DEMO) return setSave("Not saved: demonstration mode"); const v = el.value.trim(); if (!v) { el.value = d.couple[el.dataset.i]; return; } d.couple[el.dataset.i] = v; setSave("Saving"); setTimeout(() => { setSave("Saved"); V.$(".top .couple").innerHTML = `${V.esc(d.couple[0])} <span>&amp;</span> ${V.esc(d.couple[1])}`; }, 450); });
    V.$("#wd", main).onchange = (e) => { if (!e.target.value) return; if (V.DEMO) return setSave("Not saved: demonstration mode"); d.wedding = e.target.value; setSave("Saving"); setTimeout(() => setSave(`Saved. ${V.daysText()}.`), 450); };
    const r = V.$("#retry", main); if (r) r.onclick = () => { d.couple[1] = "Isabella"; V.$("#n2").closest(".field").classList.remove("failed"); r.closest(".err").remove(); setSave("Saving"); setTimeout(() => { setSave("Saved"); V.$(".top .couple").innerHTML = `${V.esc(d.couple[0])} <span>&amp;</span> ${V.esc(d.couple[1])}`; }, 450); };
    const al = V.$("#allow", main); if (al) al.onclick = () => { d.notif = "granted"; V.rerender(); V.toast("Notifications allowed on this device"); };
    const t = V.$("#test", main); if (t) t.onclick = () => V.toast("Test reminder sent. It should appear in a moment.");
    /* N3: fix a mix-up of who's who; your own changes and your partner's are named from this */
    const sw = V.$("#swap", main); if (sw) sw.onclick = () => { const swap = () => { [d.me.name, d.partner] = [d.partner, d.me.name]; V.rerender(); }; swap(); V.saved(`Swapped. You're ${V.esc(d.me.name)} now`, swap); };
  },
});
</script>
</body>
</html>
