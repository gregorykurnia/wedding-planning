<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Jost:wght@300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/veil.css">
</head>
<body>
<main id="main"></main>
<script src="assets/data.js"></script>
<script src="assets/data-vendors.js"></script>
<script src="assets/app.js"></script>
<script>
const V = Veil;
V.init({
  where: "Budget", noun: "the budget",
  states: [["empty", "Nothing booked yet"], ["loading", "Loading"], ["error", "Couldn't load"], ["offline", "Offline"], ["demo", "Demonstration mode"], ["sync", "Bella's change arrives"], ["sync-self", "Your own change from your phone"], ["eve", "The day before the wedding"], ["day", "The wedding day"], ["after", "After the wedding, payments left"], ["settled", "After the wedding, all settled"]],
  render(main) {
    const d = V.data, B = V.budget(), dues = V.dues();
    const add = `<a class="btn add-fab" href="${V.href("booking-new.html")}">Add booking</a>`;

    if (!d.bookings.length) {
      main.innerHTML = `<section class="hero"><h1>Budget</h1></section><div class="message inline">${V.ICON.knot}<h1>Nothing booked yet</h1>
        <p>When you choose a vendor or book a venue, it lands here as a booking with its price and payments. You can also add one yourself.</p>
        <div class="acts"><a class="btn" href="${V.href("booking-new.html")}">Add booking</a>${d.whatifs.length ? "" : `<a class="btn quiet" href="${V.href("whatif.html")}">Try a what-if item</a>`}</div></div>
        ${V.daysLine()}`;
      return;
    }

    const pct = B.price ? Math.max(0, Math.min(100, Math.round(B.paid / B.price * 100))) : 0;
    const late = dues.filter((x) => x.urgency === "late");
    const first = dues[0], second = dues[1];
    const flag = (x) => x.urgency === "late" ? `<span class="flag">${V.relDue(x.due)}</span>` : x.urgency === "soon" ? `<span class="flag gold">${V.relDue(x.due)}</span>` : `<span class="flag calm">${V.dateShort(x.due)}</span>`;
    const title = (x) => x.b.parts ? `${x.b.name}, ${x.p.name.toLowerCase()}` : x.b.name;
    const when = (x) => x.urgency === "late" ? `was due ${V.dateLong(x.due)}` : `due ${V.dateLong(x.due)}`;

    const next = first ? `<section class="card next" aria-label="Next payment">
        <span class="label">${late.length > 1 ? `Next to pay, 1 of ${late.length} late` : "Next to pay"}</span>${flag(first)}
        <h2 class="name"><a href="${V.href("booking.html", { id: first.b.id })}" style="text-decoration:none">${V.esc(title(first))}</a></h2>
        <span class="amt num">${V.rp(first.left)}</span>
        <span class="meta">${V.esc(first.b.category || "No category")}, ${V.esc(V.paidBy(first.funder))}, ${when(first)}</span>
        <button class="btn" data-pay="${first.b.id}" data-part="${first.p.id || ""}">Record payment</button>
      </section>
      ${second ? `<p class="after">After that, <b>${V.rp(second.left)}</b> to ${V.esc(second.b.name)} on ${V.dateLong(second.due)}.</p>` : ""}`
      : `<section class="card next" aria-label="Next payment"><span class="label">Next to pay</span><span></span><h2>Nothing due right now</h2><span></span><span class="meta">Every booking with a due date is paid up. Give a booking a due date to see it here.</span></section>`;

    const overNote = B.over ? `, <span class="late">${B.over} overpaid</span>` : "";
    const fs = V.byFunder(), un = fs.find((f) => f.id === null);
    const funderNote = d.funders.length <= 4 ? V.andList(d.funders.map((f) => f.name)) : V.plural(d.funders.length, "funder");
    const lastDue = dues.length ? V.monthOf(dues[dues.length - 1].due) : "";
    const wi = V.whatif();

    main.innerHTML = `<section class="hero">
        <h1>Budget</h1>
        <p class="kicker" style="margin-top:30px">${B.left < 0 ? "Overpaid by" : "Still to pay"}</p>
        <p class="figure num ${B.left < 0 ? "late" : ""} ${V.longFig(B.left)}">${V.fig(Math.abs(B.left))}</p>
        <p class="context">${B.left < 0 ? `<b class="num">${V.rp(B.paid)}</b> paid against <b class="num">${V.rp(B.price)}</b> committed. Check the overpaid bookings.` : `of <b class="num">${V.rp(B.price)}</b> committed, with <b class="num">${V.rp(B.paid)}</b> already paid`}</p>
        <div class="thread ${B.left < 0 ? "over" : ""}" role="img" aria-label="${pct}% paid"><span class="done" style="width:${pct}%"></span><span class="dot" style="left:${pct}%"></span><span class="ends"><span>${pct}% paid</span><span>${B.left < 0 ? "overpaid" : (100 - pct) + "% to go"}</span></span></div>
      </section>
      ${next}
      <ul class="doors">
        <li><a href="${V.href("bookings.html")}"><span class="t">Bookings</span><span class="v">${V.plural(B.count, "booking")}${B.over ? `, <span style="color:var(--rose-ink)">${B.over} overpaid</span>` : ""}</span>${V.ICON.chev}</a></li>
        <li><a href="${V.href("payments.html")}"><span class="t">Payments due</span><span class="v">${dues.length ? `${late.length ? `<span style="color:var(--rose-ink)">${late.length} late</span>, ` : ""}${V.plural(dues.length, "payment")} until ${lastDue}` : "Nothing due"}</span>${V.ICON.chev}</a></li>
        <li><a href="${V.href("funders.html")}"><span class="t">Who pays</span><span class="v">${V.esc(funderNote)}${un.left > 0 ? `, ${V.rp(un.left)} not assigned` : ""}</span>${V.ICON.chev}</a></li>
        <li><a href="${V.href("whatif.html")}"><span class="t">What-if items</span><span class="v">${d.whatifs.length ? `Would bring the total to <span class="num">${V.rp(B.price + wi)}</span>` : "None yet"}</span>${V.ICON.chev}</a></li>
      </ul>
      ${V.daysLine()}
      ${add}`;

    V.$$("[data-pay]", main).forEach((b) => b.onclick = () => V.recordPayment(b.dataset.pay, b.dataset.part || null));
    const n = V.$(".next", main); if (n && first) n.dataset.id = first.b.id;
  },
});
</script>
</body>
</html>
