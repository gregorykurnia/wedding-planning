<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Jost:wght@300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/veil.css">
</head>
<body>
<main id="main"></main>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
const V = Veil, S = V.STATE;
const num = (s) => parseInt(String(s).replace(/\D/g, "") || "0", 10);
const prefill = S === "failed" || S === "busy";

V.init({
  where: "Budget", noun: "the budget",
  states: [["busy", "Adding"], ["failed", "Couldn't add"], ["demo", "Demonstration mode"], ["offline", "Offline"]],
  render(main) {
    const v = (a, z) => prefill ? a : z;
    main.innerHTML = `<a class="back" href="${V.href("budget.html")}">${V.ICON.back}Budget</a>
      <section class="hero"><h1>Add a booking</h1><p class="sub">For something you've booked that didn't go through Vendors or Venues. Those become bookings by themselves.</p></section>
      <form id="form" novalidate style="margin-top:36px">
        <div class="fields">
          <div class="field"><label for="n">What it is</label><input id="n" dir="auto" required placeholder="For example, Sakura Transport" value="${v("Harmoni String Quartet", "")}"></div>
          <div class="field"><label for="c">Category</label><select id="c"><option value="">Choose a category</option>${V.data.categories.map((c) => `<option ${prefill && c === "Music" ? "selected" : ""}>${V.esc(c)}</option>`).join("")}</select></div>
          <div class="field"><label for="p">Agreed price</label><input id="p" class="num" inputmode="numeric" placeholder="Rp 0" value="${v("Rp 28.000.000", "")}"></div>
          <div class="field"><label for="pd">Paid so far</label><input id="pd" class="num" inputmode="numeric" placeholder="Rp 0" value="${v("Rp 10.000.000", "")}"></div>
          <div class="field"><span class="lab">Funder</span><div class="chips" role="group" aria-label="Funder">${V.data.funders.concat([{ id: "", name: "Not assigned" }]).map((f) => `<button type="button" class="chip" data-f="${f.id}" aria-pressed="${prefill ? f.id === "greg" : f.id === ""}">${V.esc(f.name)}</button>`).join("")}</div></div>
          <div class="field"><label for="d">Next due date</label><input id="d" type="date" value="${v("2026-12-10", "")}"></div>
          <div class="field"><label for="s">Next step</label><input id="s" placeholder="What has to happen next" value="${v("Send the song list and pay the balance", "")}"></div>
          <div class="field"><span class="lab">Files</span><div><button type="button" class="link" data-later="1">Attach a contract or receipt</button></div></div>
        </div>
        <p class="note">Paying in instalments? Add the booking first, then split it into parts.</p>
        ${S === "failed" ? `<p class="banner rose" style="margin-top:24px;border-radius:16px">The booking wasn't added: the planner lost its connection. Everything you entered is still here.</p>` : ""}
        <p style="text-align:center;margin-top:32px;display:flex;gap:12px;justify-content:center">
          <a class="btn quiet" href="${V.href("budget.html")}">Cancel</a>
          <button class="btn ${S === "busy" ? "busy" : ""}" id="go" ${V.DEMO ? "disabled" : ""}>${S === "busy" ? "Adding" : S === "failed" ? "Try again" : "Add booking"}</button></p>
        ${V.DEMO ? `<p class="save-state">Demonstration mode: adding is turned off.</p>` : ""}
      </form>`;
    V.$$(".chip", main).forEach((c) => c.onclick = () => V.$$(".chip", main).forEach((x) => x.setAttribute("aria-pressed", String(x === c))));
    ["p", "pd"].forEach((k) => V.$("#" + k).addEventListener("blur", (e) => { if (e.target.value) e.target.value = V.rp(num(e.target.value)); }));
    V.$("#form").onsubmit = (e) => {
      e.preventDefault();
      const n = V.$("#n");
      if (!n.value.trim()) {
        if (!V.$("#n-err")) n.closest(".field").insertAdjacentHTML("beforeend", `<p class="err" id="n-err">Give the booking a name so you can find it later.</p>`);
        n.closest(".field").classList.add("failed"); n.setAttribute("aria-describedby", "n-err"); n.focus(); return;
      }
      const go = V.$("#go"); go.classList.add("busy"); go.textContent = "Adding";
      setTimeout(() => {
        const f = V.$(".chip[aria-pressed=true]").dataset.f || null;
        const b = { id: "new" + Date.now(), name: n.value.trim(), category: V.$("#c").value, origin: { from: "direct", on: "2026-10-14" }, estimate: null,
          price: num(V.$("#p").value), paid: num(V.$("#pd").value), funder: f, due: V.$("#d").value || null, step: V.$("#s").value, files: [] };
        sessionStorage.setItem("veil-added", JSON.stringify(b));
        sessionStorage.setItem("veil-added-new", "1");
        location.href = V.href("bookings.html");
      }, 700);
    };
  },
});
</script>
</body>
</html>
